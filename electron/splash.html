<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
      border-radius: 12px;
      overflow: hidden;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .spinner-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #1e3a5f;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="logo">⚾ MLB Analytics</div>
  <div class="tagline">AI-powered baseball intelligence</div>
  <div class="spinner-row">
    <div class="spinner"></div>
    <span id="status">Starting up…</span>
  </div>
</body>
</html>
